<!doctype html>
<!--
	Black before anything else exists: the app is `ssr = false`, so until the
	bundle boots and the splash mounts, this is the whole first paint. The splash
	then rises out of the same black rather than flashing a white page first.
-->
<html lang="en" style="background: #030507">

	<head>
		<meta charset="utf-8" />
		<!--
			viewport-fit=cover is what makes env(safe-area-inset-*) resolve to
			anything other than 0. The phone shell pads its top bar, transport and
			drawer off those insets, so without this the chrome sits under the notch
			and the home indicator on every iPhone and the padding silently does
			nothing.
		-->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#0a0b0c" />
		<!--
			The layout sets this too, but only once the client has run: the app is
			`ssr = false`, so the served HTML carries no title of its own and the tab
			reads as the bare URL until the bundle boots. Same string in both places.
		-->
		<title>BEATSMAXXER PRO</title>
		<!-- The splash readout's pixel face, fetched before the bundle asks for it. -->
		<link rel="preload" href="/fonts/press-start-2p-400.woff2" as="font" type="font/woff2" crossorigin />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
