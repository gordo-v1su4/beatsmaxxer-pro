[package]
name = "beatsmaxxer-pro-desktop"
version = "0.2.1"
description = "Beatsmaxxer Pro — Tauri desktop shell"
authors = ["Beatsmaxxer Pro"]
edition = "2021"

[lib]
name = "beatsmaxxer_pro_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
