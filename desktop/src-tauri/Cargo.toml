[package]
name = "beat-surfer-pro-desktop"
version = "0.1.0"
description = "Beat Surfer Pro — Tauri desktop shell"
authors = ["Beat Surfer Pro"]
edition = "2021"

[lib]
name = "beat_surfer_pro_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
bsp-decode = { path = "../../crates/bsp-decode" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
