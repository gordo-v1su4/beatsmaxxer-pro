# Beatsmaxxer Pro — optional GPU sandbox for WebGPU browser gates.
#
# Bring up:   docker compose up -d --build
# Dev server: http://localhost:5174  (port mapped below)
#
# GPU is reserved so browser gates can run inside the container, e.g.:
#   docker compose exec beatsmaxxer-pro \
#     xvfb-run -a bun run test:local
#
# Hosted analysis (dev only): set ESSENTIA_* in `.env` — see `.env.example`
# (values belong in git-ignored `.env` / `.env.local`, never in this file).

services:
  beatsmaxxer-pro:
    build: .
    image: beatsmaxxer-pro:local
    container_name: beatsmaxxer-pro
    restart: unless-stopped
    ports:
      - "5174:5174"
    shm_size: "1gb"
    env_file:
      - .env
    environment:
      DEV_HOST: "0.0.0.0"
    volumes:
      - ".:/app"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
