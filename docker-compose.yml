# Beatsmaxxer Pro — app-vm GPU sandbox (Cursor Cloud-style container).
#
# Deploy layout on app-vm (matches the /opt/<service> convention):
#   /opt/beatsmaxxer-pro/          this repo checkout
#   /opt/beatsmaxxer-pro/.env      secrets (gitignored) — see .env.example
#
# Bring up:   docker compose up -d --build
# Dev server: http://<app-vm-tailscale-ip>:5174  (e.g. http://100.118.78.13:5174)
#
# GPU is reserved so browser gates run on the RTX 4090 inside the container:
#   docker compose exec beatsmaxxer-pro \
#     xvfb-run -a bun run test:local
#
# Essentia analysis proxy (dev only) uses the public endpoint:
#   ESSENTIA_ANALYSIS_ENABLED=true
#   ESSENTIA_API_BASE_URL=https://essentia.v1su4.dev
#   ESSENTIA_API_KEY=<from the essentia-endpoint deployment; stored in BWS>

services:
  beatsmaxxer-pro:
    build: .
    image: beatsmaxxer-pro:local
    container_name: beatsmaxxer-pro
    restart: unless-stopped
    ports:
      - "5174:5174"
    shm_size: "1gb"
    env_file:
      - .env
    environment:
      DEV_HOST: "0.0.0.0"
    volumes:
      - ".:/app"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
