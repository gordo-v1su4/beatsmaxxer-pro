name: Release

# Every push to main publishes a signed, versioned desktop update.
# Push a version tag to publish a stable updater release:
#   git tag v0.2.0 && git push origin v0.2.0
# The job builds the installers and attaches them to a public GitHub release.
#
# "Run workflow" from the Actions tab builds the same artifacts without
# publishing anything — useful for checking a build before tagging.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    # Tauri does not cross-compile: a Windows installer must be built on
    # Windows. Add a macOS entry to this matrix if a Mac build is ever wanted.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Assign desktop update version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main') {
            $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" 2> release-error.txt
            if ($LASTEXITCODE -eq 0) {
              $env:LATEST_DESKTOP_TAG = ($release | ConvertFrom-Json).tag_name
            } elseif ((Get-Content release-error.txt -Raw) -notmatch 'HTTP 404') {
              throw 'Could not read the latest desktop release; refusing to reuse a version.'
            }
          }
          bun scripts/desktop-release-version.ts
          if ($LASTEXITCODE -ne 0) { throw 'Could not assign desktop version.' }

      - name: Verify desktop release version
        shell: pwsh
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $packageVersion = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $cargo = Get-Content desktop/src-tauri/Cargo.toml -Raw
          $lock = Get-Content desktop/src-tauri/Cargo.lock -Raw
          $cargoVersion = [regex]::Match($cargo, '(?m)^version = "([^"]+)"').Groups[1].Value
          $lockVersion = [regex]::Match($lock, 'name = "beatsmaxxer-pro-desktop"\s+version = "([^"]+)"').Groups[1].Value
          if (@($packageVersion, $cargoVersion, $lockVersion) | Where-Object { $_ -ne $version }) {
            throw 'Desktop package, Cargo manifest, lockfile and Tauri versions must match.'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag must be v$version."
          }
          Write-Output "Desktop release version: $version"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Keyed on the lockfile so the cache invalidates when dependencies move.
      # Without this every run recompiles the full Tauri dependency tree.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.target }}

      # Root postinstall also installs svelte/. The desktop install provides
      # @tauri-apps/cli so `bunx tauri` does not fetch it at build time.
      - name: Install dependencies
        run: |
          bun install
          bun install --cwd desktop

      - name: Verify shared application and desktop bridge
        run: |
          bun run test
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib

      # The frontend is NOT built here: tauri.conf.json's beforeBuildCommand
      # runs `build:desktop-frontend` itself, so CI and local builds go through
      # exactly one path. Building it here too would just double the work.
      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: bunx tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ steps.version.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseName: Beatsmaxxer Pro ${{ steps.version.outputs.version }}
          releaseBody: |
            Download the Windows installer below.

            This desktop build is updater-enabled. Production WebGPU proof remains tracked separately in svelte/docs/SHIP_PLAN.md.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: true
