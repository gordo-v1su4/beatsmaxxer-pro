name: Release

# Push a version tag to cut a release:
#   git tag v0.2.0 && git push origin v0.2.0
# The job builds the installers and attaches them to a DRAFT GitHub release, so
# nothing is public until you review the artifacts and press Publish.
#
# "Run workflow" from the Actions tab builds the same artifacts without
# publishing anything — useful for checking a build before tagging.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    # Tauri does not cross-compile: a Windows installer must be built on
    # Windows. Add a macOS entry to this matrix if a Mac build is ever wanted.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Keyed on the lockfile so the cache invalidates when dependencies move.
      # Without this every run recompiles the full Tauri dependency tree.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.target }}

      # Root postinstall also installs svelte/. The desktop install provides
      # @tauri-apps/cli so `bunx tauri` does not fetch it at build time.
      - name: Install dependencies
        run: |
          bun install
          bun install --cwd desktop

      # The frontend is NOT built here: tauri.conf.json's beforeBuildCommand
      # runs `build:desktop-frontend` itself, so CI and local builds go through
      # exactly one path. Building it here too would just double the work.
      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: bunx tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Beatsmaxxer Pro ${{ github.ref_name }}
          releaseBody: |
            Download the Windows installer below.

            This desktop build is updater-enabled. Production WebGPU proof remains tracked separately in svelte/docs/SHIP_PLAN.md.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: true
