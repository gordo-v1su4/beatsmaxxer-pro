# Implementation: gordo-v1su4/proxmox-home/.github/workflows/ocr-review-reusable.yml
name: Alibaba OpenCodeReview PR Review

on:
  pull_request_target:
    types: [opened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing open pull request to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ocr-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    uses: gordo-v1su4/proxmox-home/.github/workflows/ocr-review-reusable.yml@main
    with:
      pr_number: ${{ inputs.pr_number || '' }}
    secrets:
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
