name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install
        run: bun install

      - name: Unit tests (no GPU)
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Install Chromium (CDP smoke)
        run: |
          cd svelte
          bunx playwright install chromium
          bunx playwright install-deps chromium
          CHROME="$(find "$HOME/.cache/ms-playwright" -name chrome -type f | head -1)"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"

      - name: Sequencer ARM QA autoload smoke (#25)
        run: cd svelte && bash scripts/ci-sequencer-arm-smoke.sh
