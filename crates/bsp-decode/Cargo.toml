[package]
name = "bsp-decode"
version = "0.1.0"
edition = "2021"
description = "Beatsmaxxer Pro native decode — MP4 demux + VideoToolbox (macOS)"

[features]
default = []
# Temporary compatibility bridge for the WebView BSPF renderer. Native desktop
# playback must not enable or call this after compositor integration.
cpu-frame-bridge = []

[dependencies]
mp4 = "0.14"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-av-foundation = { version = "0.3.2", features = ["AVAsset", "AVAssetReader", "AVAssetReaderOutput", "AVAssetTrack", "AVMediaFormat", "objc2-core-media"] }
objc2-core-foundation = "0.3.2"
objc2-core-media = { version = "0.3.2", features = ["CMSampleBuffer", "CMTime", "CMTimeRange"] }
objc2-core-video = { version = "0.3.2", features = ["CVPixelBuffer", "CVPixelBufferIOSurface", "objc2-io-surface"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSDictionary", "NSError", "NSObject", "NSString", "NSURL", "NSValue"] }
objc2-io-surface = { version = "0.3.2", features = ["IOSurfaceRef", "objc2-core-foundation"] }
