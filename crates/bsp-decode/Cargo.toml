[package]
name = "bsp-decode"
version = "0.1.0"
edition = "2021"
description = "Beat Surfer Pro native decode — MP4 demux + VideoToolbox (macOS)"

[dependencies]
base64 = "0.22"
mp4 = "0.14"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# VideoToolbox bindings land in a follow-up; macOS build exposes the module stub today.
