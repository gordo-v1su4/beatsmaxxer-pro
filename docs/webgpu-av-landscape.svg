<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" role="img" aria-labelledby="title desc">
  <title id="title">WebGPU AV project landscape</title>
  <desc id="desc">Approximate positioning of Beatsmaxxer Pro, Beatform, FreeCut, and XGPU on axes from timeline editor to live VJ performance and from generative visuals to live video clips.</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d12"/>
      <stop offset="100%" stop-color="#12161f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="920" height="640" fill="url(#bg)"/>

  <text x="460" y="42" text-anchor="middle" fill="#f3f4f6" font-family="Segoe UI, system-ui, sans-serif" font-size="24" font-weight="700">
    WebGPU AV project landscape
  </text>
  <text x="460" y="68" text-anchor="middle" fill="#9ca3af" font-family="Segoe UI, system-ui, sans-serif" font-size="14">
    Approximate positioning  not a precise metric
  </text>

  <!-- plot area -->
  <rect x="120" y="100" width="680" height="460" rx="12" fill="#151922" stroke="#2a3140"/>

  <!-- grid -->
  <g stroke="#243041" stroke-width="1">
    <line x1="460" y1="100" x2="460" y2="560"/>
    <line x1="120" y1="330" x2="800" y2="330"/>
    <line x1="290" y1="100" x2="290" y2="560" stroke-dasharray="4 6"/>
    <line x1="630" y1="100" x2="630" y2="560" stroke-dasharray="4 6"/>
    <line x1="120" y1="215" x2="800" y2="215" stroke-dasharray="4 6"/>
    <line x1="120" y1="445" x2="800" y2="445" stroke-dasharray="4 6"/>
  </g>

  <!-- axis labels -->
  <text x="460" y="592" text-anchor="middle" fill="#d1d5db" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="600">
    Timeline editor  êí  Live VJ / performance
  </text>
  <text x="48" y="335" text-anchor="middle" fill="#d1d5db" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="600" transform="rotate(-90 48 335)">
    Generative visuals  êí  Live video clips
  </text>

  <!-- quadrant hints -->
  <text x="205" y="145" fill="#6b7280" font-family="Segoe UI, system-ui, sans-serif" font-size="12">Editor + generative</text>
  <text x="620" y="145" fill="#6b7280" font-family="Segoe UI, system-ui, sans-serif" font-size="12">VJ + generative</text>
  <text x="205" y="545" fill="#6b7280" font-family="Segoe UI, system-ui, sans-serif" font-size="12">Editor + live clips</text>
  <text x="620" y="545" fill="#6b7280" font-family="Segoe UI, system-ui, sans-serif" font-size="12">VJ + live clips</text>

  <!-- points -->
  <!-- FreeCut: timeline editor (left), live video clips (bottom) -->
  <g filter="url(#shadow)">
    <circle cx="250" cy="470" r="10" fill="#60a5fa"/>
    <rect x="170" y="488" width="160" height="52" rx="8" fill="#1f2937" stroke="#374151"/>
    <text x="250" y="510" text-anchor="middle" fill="#f9fafb" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">FreeCut</text>
    <text x="250" y="528" text-anchor="middle" fill="#9ca3af" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Browser NLE + GPU FX</text>
  </g>

  <!-- Beatform: live VJ (right), generative visuals (top) -->
  <g filter="url(#shadow)">
    <circle cx="650" cy="190" r="10" fill="#fbbf24"/>
    <rect x="570" y="208" width="160" height="52" rx="8" fill="#1f2937" stroke="#374151"/>
    <text x="650" y="230" text-anchor="middle" fill="#f9fafb" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">Beatform</text>
    <text x="650" y="248" text-anchor="middle" fill="#9ca3af" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Beat-sync visualizer</text>
  </g>

  <!-- XGPU: middle -->
  <g filter="url(#shadow)">
    <circle cx="460" cy="330" r="10" fill="#a78bfa"/>
    <rect x="395" y="348" width="130" height="44" rx="8" fill="#1f2937" stroke="#374151"/>
    <text x="460" y="368" text-anchor="middle" fill="#f9fafb" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">XGPU</text>
    <text x="460" y="384" text-anchor="middle" fill="#9ca3af" font-family="Segoe UI, system-ui, sans-serif" font-size="11">WebGPU library</text>
  </g>

  <!-- Beatsmaxxer Pro: live VJ (far right), live video clips (bottom) -->
  <g filter="url(#shadow)">
    <circle cx="720" cy="430" r="12" fill="#34d399" stroke="#ecfdf5" stroke-width="2"/>
    <rect x="610" y="448" width="220" height="68" rx="8" fill="#064e3b" stroke="#34d399"/>
    <text x="720" y="472" text-anchor="middle" fill="#ecfdf5" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700">Beatsmaxxer Pro</text>
    <text x="720" y="492" text-anchor="middle" fill="#a7f3d0" font-family="Segoe UI, system-ui, sans-serif" font-size="11">SvelteKit + WebGPU rack + PGM</text>
    <text x="720" y="506" text-anchor="middle" fill="#6ee7b7" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Unique combo in public OSS</text>
  </g>

  <!-- legend -->
  <g transform="translate(120, 610)">
    <circle cx="8" cy="-8" r="6" fill="#34d399"/>
    <text x="22" y="-4" fill="#d1d5db" font-family="Segoe UI, system-ui, sans-serif" font-size="12">This project</text>
    <circle cx="148" cy="-8" r="6" fill="#60a5fa"/>
    <text x="162" y="-4" fill="#d1d5db" font-family="Segoe UI, system-ui, sans-serif" font-size="12">Closest technical peer</text>
    <circle cx="338" cy="-8" r="6" fill="#fbbf24"/>
    <text x="352" y="-4" fill="#d1d5db" font-family="Segoe UI, system-ui, sans-serif" font-size="12">Closest product peer</text>
  </g>
</svg>
