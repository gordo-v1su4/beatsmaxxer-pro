<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="roadmap-title roadmap-desc" id="roadmap-root"><title id="roadmap-title">Beatsmaxxer roadmap</title><desc id="roadmap-desc">Shipped performance, Timing, Arrange and Resolve export milestones lead into refinement of pacing, the Perform handoff and wider compatibility, with new platforms and experiments planned later.</desc>
  <defs>
      <style>#roadmap-root { color-scheme:dark }
      #roadmap-root { color: #edf0f3; font-family: 'Avenir Next Condensed','Arial Narrow',Arial,sans-serif; }
      #roadmap-root .diagram-container { width:100%;overflow-x:auto }
      #roadmap-root text { font-family:'Avenir Next Condensed','Arial Narrow',Arial,sans-serif;fill:#edf0f3 }
      #roadmap-root .heading { font-size:14px;font-weight:400;letter-spacing:1.5px }
      #roadmap-root .label { font-size:10px;letter-spacing:1.5px;fill:#a2abb6 }
      #roadmap-root .name { font-size:11px;font-weight:400;letter-spacing:1px }
      #roadmap-root .detail { font-size:10px;letter-spacing:.5px;fill:#a2abb6 }
      #roadmap-root .column { font-size:12px;font-weight:400;letter-spacing:1.5px }
      #roadmap-root .mint { fill:#99f6e4 }
      #roadmap-root .note { font-size:10px;fill:#a2abb6 }</style>
  </defs><rect width="960" height="600" fill="#0a0b0c"/><text x="32" y="40" class="label">BEATSMAXXER PRO / PRODUCT ROADMAP</text><text x="32" y="80" class="heading">FROM LIVE PLAY TO A FINISHED CUT.</text><text x="32" y="108" class="detail">TIMING FIRST PASS IS SHIPPED. THE FINISHING WORKFLOW IS THE NEXT DESIGN QUESTION.</text><text x="32" y="160" class="column ">NEXT TO REFINE</text><text x="32" y="184" class="label">REVIEW QUEUE</text><line x1="32" y1="200" x2="320" y2="200" stroke="#35413f" stroke-width="1"/><rect x="32" y="216" width="288" height="60" rx="2" fill="#15191d"/><text x="44" y="240" class="name">TIMING → PERFORM</text><text x="44" y="260" class="detail">DEFINE THE FINISHING HANDOFF</text><rect x="32" y="288" width="288" height="60" rx="2" fill="#15191d"/><text x="44" y="312" class="name">MORE MUSICAL PACING</text><text x="44" y="332" class="detail">SHOT LENGTHS WITH USEFUL LIMITS</text><rect x="32" y="360" width="288" height="60" rx="2" fill="#15191d"/><text x="44" y="384" class="name">BROADER RESOLVE TESTS</text><text x="44" y="404" class="detail">FULL SONGS · MORE SOURCE FORMATS</text><text x="336" y="160" class="column mint">SHIPPED</text><text x="336" y="184" class="label">READY TO USE</text><line x1="336" y1="200" x2="624" y2="200" stroke="#35413f" stroke-width="1"/><rect x="336" y="216" width="288" height="60" rx="2" fill="#15191d"/><text x="348" y="240" class="name">PLAY &amp; PERFORM</text><text x="348" y="260" class="detail">TEN CLIPS · MIDI · SHADER EFFECTS</text><rect x="336" y="288" width="288" height="60" rx="2" fill="#15191d"/><text x="348" y="312" class="name">TIMING &amp; ARRANGE</text><text x="348" y="332" class="detail">THREE TOOLS · TAKES · BANKS</text><rect x="336" y="360" width="288" height="60" rx="2" fill="#16302b"/><text x="348" y="384" class="name">EXPORT &amp; RESOLVE</text><text x="348" y="404" class="detail">SOURCE RESOLUTION · RESOLVE</text><rect x="336" y="432" width="288" height="60" rx="2" fill="#15191d"/><text x="348" y="456" class="name">HELP &amp; WINDOWS</text><text x="348" y="476" class="detail">VISUAL GUIDES · DESKTOP 0.2.10</text><text x="640" y="160" class="column ">LATER</text><text x="640" y="184" class="label">EXPLORATION</text><line x1="640" y1="200" x2="928" y2="200" stroke="#35413f" stroke-width="1"/><rect x="640" y="216" width="288" height="60" rx="2" fill="#15191d"/><text x="652" y="240" class="name">MORE PLACES TO PLAY</text><text x="652" y="260" class="detail">MACOS · IPHONE SHELL</text><rect x="640" y="288" width="288" height="60" rx="2" fill="#15191d"/><text x="652" y="312" class="name">MORE WAYS TO PLAY</text><text x="652" y="332" class="detail">CLIP PACKS · GAMES · TRAILER</text><line x1="32" y1="532" x2="928" y2="532" stroke="#35413f" stroke-width="1"/><text x="32" y="556" class="note">SNAPSHOT / 18 OCT 2026</text><text x="32" y="580" class="note">COMPLETION CHECKBOXES LIVE IN THE README. FUTURE ITEMS HAVE NO COMMITTED DATES.</text></svg>
