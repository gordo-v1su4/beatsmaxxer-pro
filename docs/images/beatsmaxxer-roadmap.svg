<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="roadmap-title roadmap-desc" id="roadmap-root"><title id="roadmap-title">Beatsmaxxer roadmap</title><desc id="roadmap-desc">Shipped performance, Timing, Arrange and Resolve export milestones lead into refinement of pacing, the Perform handoff and wider compatibility, with new platforms and experiments planned later.</desc>
  <defs>
      <style>#roadmap-root { color-scheme:dark }
      #roadmap-root { color: #edf0f3; font-family: 'Avenir Next Condensed','Arial Narrow',Arial,sans-serif; }
      #roadmap-root .diagram-container { width:100%;overflow-x:auto }
      #roadmap-root text { font-family:'Avenir Next Condensed','Arial Narrow',Arial,sans-serif;fill:#edf0f3 }
      #roadmap-root .heading { font-size:28px;font-weight:600 }
      #roadmap-root .label { font-size:11px;letter-spacing:1.5px;fill:#a2abb6 }
      #roadmap-root .name { font-size:18px;font-weight:600 }
      #roadmap-root .detail { font-size:13px;fill:#b6bec8 }
      #roadmap-root .column { font-size:19px;font-weight:600 }
      #roadmap-root .mint { fill:#99f6e4 }
      #roadmap-root .note { font-size:12px;fill:#a2abb6 }</style>
  </defs><rect width="960" height="600" fill="#0a0b0c"/><text x="32" y="40" class="label">BEATSMAXXER PRO / PRODUCT ROADMAP</text><text x="32" y="80" class="heading">From live play to a finished cut.</text><text x="32" y="108" class="detail">Timing first pass is shipped. The finishing workflow is the next design question.</text><text x="32" y="160" class="column mint">Shipped</text><text x="32" y="184" class="label">READY TO USE</text><line x1="32" y1="200" x2="320" y2="200" stroke="#35413f" stroke-width="1"/><rect x="32" y="216" width="288" height="60" rx="2" fill="#15191d"/><text x="44" y="240" class="name">Play &amp; perform</text><text x="44" y="260" class="detail">Ten clips · MIDI · shader effects</text><rect x="32" y="288" width="288" height="60" rx="2" fill="#15191d"/><text x="44" y="312" class="name">Timing &amp; Arrange</text><text x="44" y="332" class="detail">Three tools · takes · banks</text><rect x="32" y="360" width="288" height="60" rx="2" fill="#16302b"/><text x="44" y="384" class="name">Export &amp; Resolve</text><text x="44" y="404" class="detail">Source resolution · Resolve</text><rect x="32" y="432" width="288" height="60" rx="2" fill="#15191d"/><text x="44" y="456" class="name">Help &amp; Windows</text><text x="44" y="476" class="detail">Visual guides · desktop 0.2.10</text><text x="336" y="160" class="column ">Next to refine</text><text x="336" y="184" class="label">REVIEW QUEUE</text><line x1="336" y1="200" x2="624" y2="200" stroke="#35413f" stroke-width="1"/><rect x="336" y="216" width="288" height="60" rx="2" fill="#15191d"/><text x="348" y="240" class="name">Timing → Perform</text><text x="348" y="260" class="detail">Define the finishing handoff</text><rect x="336" y="288" width="288" height="60" rx="2" fill="#15191d"/><text x="348" y="312" class="name">More musical pacing</text><text x="348" y="332" class="detail">Shot lengths with useful limits</text><rect x="336" y="360" width="288" height="60" rx="2" fill="#15191d"/><text x="348" y="384" class="name">Broader Resolve tests</text><text x="348" y="404" class="detail">Full songs · more source formats</text><text x="640" y="160" class="column ">Later</text><text x="640" y="184" class="label">EXPLORATION</text><line x1="640" y1="200" x2="928" y2="200" stroke="#35413f" stroke-width="1"/><rect x="640" y="216" width="288" height="60" rx="2" fill="#15191d"/><text x="652" y="240" class="name">More places to play</text><text x="652" y="260" class="detail">macOS · iPhone shell</text><rect x="640" y="288" width="288" height="60" rx="2" fill="#15191d"/><text x="652" y="312" class="name">More ways to play</text><text x="652" y="332" class="detail">Clip packs · games · trailer</text><line x1="32" y1="532" x2="928" y2="532" stroke="#35413f" stroke-width="1"/><text x="32" y="556" class="note">SNAPSHOT / 18 OCT 2026</text><text x="32" y="580" class="note">Completion checkboxes live in the README. Future items have no committed dates.</text></svg>
